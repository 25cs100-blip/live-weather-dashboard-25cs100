
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="weather-container">

        <!-- Heading -->
        <header class="heading">
            <h1>Weather Dashboard</h1>
            <p>Check the weather anywhere in the world</p>
        </header>

        <!-- Search Form -->
        <form id="form" class="search-form">

            <input
                type="text"
                id="city"
                placeholder="Enter city name..."
                autocomplete="off"
                maxlength="80"
            >

            <button type="submit" id="search-btn">
                Search
            </button>

        </form>

        <!-- Status Message -->
        <p id="status" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <!-- Current Weather -->
        <section id="current-weather"
            class="current-weather"
            aria-label="Current weather">
        </section>

        <!-- Forecast -->
        <section class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div id="forecast" class="forecast-grid">
            </div>

        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>

    </main>

</body>
</html>
